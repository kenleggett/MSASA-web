<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Mississippi ASA Shooter of the Year standings.">

    <title>Shooter of the Year | Mississippi ASA</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="site-header">

    <div class="container header-content">

        <a href="index.html" class="brand">

            <img
                src="./images/asablacknewlogo.jpeg"
                alt="Mississippi ASA"
                class="site-logo"
            >

        </a>


        <nav class="main-nav">

            <a href="index.html">
                Home
            </a>

            <a href="index.html#events">
                Events
            </a>

            <a href="standings.html">
                Standings
            </a>

            <a href="index.html#classes">
                Classes
            </a>

            <a href="index.html#about">
                About
            </a>

            <a href="index.html#contact">
                Contact
            </a>

        </nav>

    </div>

</header>



<!-- =====================================================
     PAGE HEADER
===================================================== -->

<section class="page-hero">

    <div class="container">

        <p class="eyebrow">
            2026 SEASON
        </p>

        <h1>
            Shooter of the Year
        </h1>

        <p>
            Mississippi ASA Shooter of the Year standings.
        </p>

    </div>

</section>



<!-- =====================================================
     STANDINGS
===================================================== -->

<section class="standings-page">

    <div class="container">


        <!-- SEARCH AND FILTER -->

        <div class="standings-controls">


            <div class="search-control">

                <label for="shooter-search">
                    Search Shooter
                </label>

                <input
                    type="search"
                    id="shooter-search"
                    placeholder="Enter shooter name..."
                    autocomplete="off"
                >

            </div>



            <div class="class-control">

                <label for="class-filter">
                    Class
                </label>

                <select id="class-filter">

                    <option value="all">
                        All Classes
                    </option>

                </select>

            </div>


        </div>



        <!-- STANDINGS TABLE -->

        <div class="standings-table">


            <div class="standing-header">

                <span>
                    RANK
                </span>

                <span>
                    SHOOTER
                </span>

                <span>
                    CLASS
                </span>

                <span>
                    SCORE
                </span>

                <span>
                    12s
                </span>

            </div>



            <div id="standings-body">

            </div>


        </div>


    </div>

</section>



<!-- =====================================================
     FOOTER
===================================================== -->

<footer class="site-footer">

    <div class="container">

        <img
            src="./images/asablacknewlogo.jpeg"
            alt="Mississippi ASA"
            class="footer-logo"
        >

        <p>
            Mississippi Archery Shooters Association
        </p>

        <p class="copyright">
            © 2026 Mississippi ASA
        </p>

    </div>

</footer>



<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script src="js/standings-data.js"></script>

<script src="js/standings.js"></script>


</body>

</html>
