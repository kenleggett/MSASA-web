<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Mississippi ASA Shooter of the Year standings.">

    <title>Standings | Mississippi ASA</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>


<header class="site-header">

    <div class="container header-content">

        <a href="index.html" class="brand">

            <img
                src="./images/asablacknewlogo.jpeg"
                alt="Mississippi ASA"
                class="site-logo"
            >

        </a>


        <nav class="main-nav">

            <a href="index.html">Home</a>

            <a href="index.html#events">Events</a>

            <a href="standings.html">Standings</a>

            <a href="index.html#classes">Classes</a>

            <a href="index.html#about">About</a>

            <a href="index.html#contact">Contact</a>

        </nav>

    </div>

</header>



<main>


<section class="page-hero">

    <div class="container">

        <p class="eyebrow">
            2026 SEASON
        </p>

        <h1>
            Shooter of the Year
        </h1>

        <p>
            Mississippi ASA Shooter of the Year standings.
        </p>

    </div>

</section>



<section class="standings-page">

    <div class="container">


        <div class="standings-controls">

            <label for="class-filter">
                Select Class
            </label>

            <select id="class-filter">

                <option value="all">
                    All Classes
                </option>

                <option value="known">
                    Known
                </option>

                <option value="open">
                    Open
                </option>

                <option value="bowhunter">
                    Bowhunter
                </option>

                <option value="women">
                    Women's
                </option>

                <option value="youth">
                    Youth
                </option>

            </select>

        </div>



        <div class="standings-table">

            <div class="standing-header">

                <span>RANK</span>

                <span>SHOOTER</span>

                <span>CLASS</span>

                <span>SCORE</span>

                <span>12s</span>

            </div>


            <div class="standing-row">

                <strong>—</strong>

                <span>
                    Standings Coming Soon
                </span>

                <span>—</span>

                <strong>—</strong>

                <strong>—</strong>

            </div>

        </div>


    </div>

</section>

</main>



<footer class="site-footer">

    <div class="container">

        <img
            src="./images/asablacknewlogo.jpeg"
            alt="Mississippi ASA"
            class="footer-logo"
        >

        <p>
            Mississippi Archery Shooters Association
        </p>

        <p class="copyright">
            © 2026 Mississippi ASA
        </p>

    </div>

</footer>


</body>

</html>
