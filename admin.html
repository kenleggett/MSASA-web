<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
MSASA Admin Dashboard
</title>

<link rel="stylesheet"
href="css/style.css">

</head>

<body>

<header>

<h1>
Mississippi ASA Admin Dashboard
</h1>

</header>


<main>


<section class="admin-card">

<h2>
Add Shooter
</h2>


<label for="shooter-name">
Shooter Name
</label>

<input
id="shooter-name"
placeholder="Enter shooter name">


<label for="asa-number">
ASA Number
</label>

<input
id="asa-number"
placeholder="ASA Number">


<label for="class-name">
Class
</label>

<select id="class-name">

<option value="Semi-Pro Open">
Semi-Pro Open
</option>

<option value="Pro">
Pro
</option>

<option value="Known 40">
Known 40
</option>

<option value="Senior Pins">
Senior Pins
</option>

</select>


<button
type="button"
onclick="addShooter()">

Add Shooter

</button>


<p id="shooter-status"></p>

</section>



<section class="admin-card">

<h2>
Enter Score
</h2>


<label for="score-shooter">
Shooter
</label>

<select id="score-shooter">

<option value="">
Loading shooters...
</option>

</select>


<label for="event">
Event
</label>

<select id="event">

<option value="1">
Waldo's
</option>

<option value="2">
Percy Quin
</option>

<option value="3">
Pearl River
</option>

<option value="4">
Laurel
</option>

<option value="5">
Little River
</option>

<option value="6">
State Championship
</option>

</select>


<label for="score">
Score
</label>

<input
id="score"
type="number"
min="0"
placeholder="Score">


<label for="twelves">
12 Count
</label>

<input
id="twelves"
type="number"
min="0"
placeholder="12 Count">


<button
type="button"
onclick="saveScore()">

Save Score

</button>


<p id="score-status"></p>

</section>



<section class="admin-card">

<h2>
Current Shooters
</h2>


<button
type="button"
onclick="loadShooters()">

Refresh Shooters

</button>


<div id="shooter-list">

Loading...

</div>

</section>


</main>


<script src="js/admin.js"></script>

</body>

</html>
