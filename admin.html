<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>
MSASA Admin Dashboard
</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>

  <h2>Add Test Shooter</h2>

<button onclick="testAddShooter()">
Add Test Shooter
</button>

<script>
async function testAddShooter() {

  const response = await fetch("/api/add-shooter", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      name: "Test Archer",
      asa_number: "TEST002",
      class_name: "Known 40"
    })
  });

  const result = await response.json();

  alert(JSON.stringify(result));

}
</script>


<header>

<h1>
Mississippi ASA Admin Dashboard
</h1>

</header>


<main>


<section class="admin-card">

<h2>
Add Shooter
</h2>


<label>
Shooter Name
</label>

<input 
id="shooter-name"
placeholder="Enter shooter name">


<label>
ASA Number
</label>

<input 
id="asa-number"
placeholder="ASA Number">


<label>
Class
</label>

<select id="class-name">

<option>
Semi-Pro Open
</option>

<option>
Pro
</option>

<option>
Known 40
</option>

<option>
Senior Pins
</option>

</select>


<button onclick="addShooter()">
Add Shooter
</button>


</section>



<section class="admin-card">

<h2>
Enter Score
</h2>


<select id="event">

<option value="1">
Waldo's
</option>

<option value="2">
Percy Quin
</option>

<option value="3">
Pearl River
</option>

<option value="4">
Laurel
</option>

<option value="5">
Little River
</option>

<option value="6">
State Championship
</option>

</select>


<input
id="score"
placeholder="Score">


<input
id="twelves"
placeholder="12 Count">


<button onclick="saveScore()">
Save Score
</button>


</section>


</main>


<script src="js/admin.js"></script>


</body>

</html>
